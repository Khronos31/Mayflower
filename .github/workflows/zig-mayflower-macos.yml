name: zig-mayflower-macos

# Build Zig 0.16.0 + Mayflower MachO patch with LLVM on a GitHub-hosted
# macOS runner. Mac mini (8GB) OOMs on this link; GHA is the intended host
# for patched stage3 until we have more RAM locally.
on:
  workflow_dispatch:
  push:
    branches: [zig-0.16-wip]
    paths:
      - "packages/zig/**"
      - "docs/zig.md"
      - ".github/workflows/zig-mayflower-macos.yml"

permissions:
  contents: read

concurrency:
  group: zig-mayflower-macos
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.16.0"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout Mayflower
        uses: actions/checkout@v4

      - name: Install build deps (LLVM 21 + LLD + CMake/Ninja)
        run: |
          set -euo pipefail
          brew update
          # zstd: cmake zig2 link needs -lzstd (Homebrew path, not on default ld path)
          brew install cmake ninja zstd llvm@21 lld@21
          LLVM_PREFIX="$(brew --prefix llvm@21)"
          LLD_PREFIX="$(brew --prefix lld@21)"
          ZSTD_PREFIX="$(brew --prefix zstd)"
          echo "LLVM_PREFIX=$LLVM_PREFIX" >> "$GITHUB_ENV"
          echo "LLD_PREFIX=$LLD_PREFIX" >> "$GITHUB_ENV"
          echo "ZSTD_PREFIX=$ZSTD_PREFIX" >> "$GITHUB_ENV"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$LLD_PREFIX/bin" >> "$GITHUB_PATH"
          {
            echo "LDFLAGS=-L$ZSTD_PREFIX/lib -L$LLVM_PREFIX/lib -L$LLD_PREFIX/lib"
            echo "LIBRARY_PATH=$ZSTD_PREFIX/lib:$LLVM_PREFIX/lib:$LLD_PREFIX/lib"
            echo "CMAKE_PREFIX_PATH=$LLVM_PREFIX;$LLD_PREFIX;$ZSTD_PREFIX"
          } >> "$GITHUB_ENV"
          # keg-only: GITHUB_PATH applies to later steps only — use absolute paths here
          "$LLVM_PREFIX/bin/llvm-config" --version
          "$LLVM_PREFIX/bin/clang" --version | head -1
          ls "$ZSTD_PREFIX/lib"/libzstd* | head

      - name: Fetch Zig ${{ env.ZIG_VERSION }} sources
        run: |
          set -euo pipefail
          curl -fsSL -o "zig-${ZIG_VERSION}.tar.xz" \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-${ZIG_VERSION}.tar.xz"
          tar xf "zig-${ZIG_VERSION}.tar.xz"
          echo "ZIG_SRC=${GITHUB_WORKSPACE}/zig-${ZIG_VERSION}" >> "$GITHUB_ENV"

      - name: Apply Mayflower MachO patch
        run: |
          set -euo pipefail
          cd "$ZIG_SRC"
          patch -p1 < "$GITHUB_WORKSPACE/packages/zig/patches/src_link_MachO.zig.patch"
          grep -n flushMayflowerIosDevice src/link/MachO.zig | head

      - name: Configure + build + install stage3
        run: |
          set -euo pipefail
          PREFIX="${GITHUB_WORKSPACE}/zig-mayflower-prefix"
          JOBS="$(sysctl -n hw.ncpu)"
          # macos-15 GHA reports ~7.5GiB free; zig's LLVM stage3 step declares
          # max_rss=8GiB and refuses without --maxrss (zig build.zig).
          rm -rf "$ZIG_SRC/build" "$PREFIX"
          cmake -S "$ZIG_SRC" -B "$ZIG_SRC/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${LLVM_PREFIX};${LLD_PREFIX};${ZSTD_PREFIX}" \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_EXE_LINKER_FLAGS="-L${ZSTD_PREFIX}/lib" \
            -DZIG_STATIC_LLVM=OFF \
            -DZIG_EXTRA_BUILD_ARGS="--maxrss;8000000000"
          cmake --build "$ZIG_SRC/build" --parallel "$JOBS"
          cmake --install "$ZIG_SRC/build"
          if [ -x "$PREFIX/bin/zig" ]; then
            ZIG_BIN="$PREFIX/bin/zig"
          elif [ -x "$PREFIX/zig" ]; then
            ZIG_BIN="$PREFIX/zig"
          else
            STAGE3_ZIG="$(find "$ZIG_SRC/build" -type f -name zig -path '*/stage3/bin/*' | head -1)"
            test -n "$STAGE3_ZIG"
            mkdir -p "$PREFIX/bin"
            cp "$STAGE3_ZIG" "$PREFIX/bin/zig"
            if [ -d "$ZIG_SRC/build/stage3/lib" ]; then
              cp -R "$ZIG_SRC/build/stage3/lib" "$PREFIX/"
            fi
            ZIG_BIN="$PREFIX/bin/zig"
          fi
          echo "ZIG_BIN=$ZIG_BIN" >> "$GITHUB_ENV"
          "$ZIG_BIN" version
          ls -lh "$ZIG_BIN"
          otool -L "$ZIG_BIN" | head -40

      - name: Smoke — patched zig build-exe aarch64-ios
        run: |
          set -euo pipefail
          brew install ldid || true
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          test -n "$SDK" && test -d "$SDK"
          WORK="${GITHUB_WORKSPACE}/smoke-hello"
          mkdir -p "$WORK"
          cat > "$WORK/hello.zig" <<'ZIG'
          const std = @import("std");
          pub fn main() void {
              std.debug.print("hello\n", .{});
          }
          ZIG
          cat > "$WORK/entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>platform-application</key>
            <true/>
            <key>com.apple.private.security.container-required</key>
            <false/>
          </dict>
          </plist>
          PLIST
          export ZIG_LDID_ENTITLEMENTS="$WORK/entitlements.plist"
          cd "$WORK"
          set +e
          "$ZIG_BIN" build-exe hello.zig -target aarch64-ios -mcpu=apple_a11 \
            -OReleaseSmall --sysroot "$SDK" -fno-strip --verbose-link \
            > link.log 2>&1
          EC=$?
          set -e
          tail -100 link.log || true
          if [ "$EC" -ne 0 ] || [ ! -f ./hello ]; then
            echo "::error::patched zig build-exe failed (exit $EC); see link.log"
            exit 1
          fi
          if ! grep -Eiq 'clang|mayflower_ios_dyld_stub|flushMayflower' link.log; then
            echo "::warning::verbose-link log did not clearly show clang/stub; see link.log"
          fi
          # Must not still be missing the ios-unavailable dyld SelfInfo symbols.
          if grep -q 'dyld_get_image_header_containing_address' link.log && grep -q 'Undefined symbols' link.log; then
            echo "::error::dyld SelfInfo symbol still undefined after stub"
            exit 1
          fi
          file hello
          lipo -info hello || true
          if command -v ldid >/dev/null; then
            ldid -e hello || true
          fi
          cp hello "${GITHUB_WORKSPACE}/hello-aarch64-ios" || true
          cp link.log "${GITHUB_WORKSPACE}/smoke-link.log" || true

      - name: Pack artifact
        run: |
          set -euo pipefail
          PREFIX="${GITHUB_WORKSPACE}/zig-mayflower-prefix"
          test -x "$PREFIX/bin/zig" || test -x "$ZIG_BIN"
          if [ ! -x "$PREFIX/bin/zig" ]; then
            mkdir -p "$PREFIX/bin"
            cp "$ZIG_BIN" "$PREFIX/bin/zig"
          fi
          cat > "$PREFIX/MAYFLOWER-README.txt" <<'TXT'
          Mayflower patched Zig (macos aarch64 host)
          - Zig 0.16.0 + packages/zig/patches/src_link_MachO.zig.patch
          - ios device Exe/dylib: system clang link, then ldid last
          - ZIG_LDID_ENTITLEMENTS for entitlements (Go-style); no ZIG_NO_LDID
          - Built on GitHub Actions macos-15 with Homebrew llvm@21
          If otool shows Homebrew LLVM dylibs, install llvm@21 (and lld@21)
          on the machine that runs this binary, or prefer a static build.
          TXT
          tar -C "${GITHUB_WORKSPACE}" -czf \
            "zig-mayflower-${ZIG_VERSION}-aarch64-macos.tar.gz" zig-mayflower-prefix
          ls -lh "zig-mayflower-${ZIG_VERSION}-aarch64-macos.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zig-mayflower-${{ env.ZIG_VERSION }}-aarch64-macos
          path: |
            zig-mayflower-${{ env.ZIG_VERSION }}-aarch64-macos.tar.gz
            hello-aarch64-ios
            smoke-link.log
          if-no-files-found: error
          retention-days: 30

  # Cross-build an ios-host zig (no embedded LLVM) for packages/zig deb.
  # Uses the patched macos-host from `build` so Mayflower clang+ldid links
  # the device binary. Mac mini does not run this locally (RAM).
  ios-host:
    needs: build
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout Mayflower
        uses: actions/checkout@v4

      - name: Download macos-host artifact
        uses: actions/download-artifact@v4
        with:
          name: zig-mayflower-${{ env.ZIG_VERSION }}-aarch64-macos
          path: macos-art

      - name: Unpack macos-host zig
        run: |
          set -euo pipefail
          tar xzf "macos-art/zig-mayflower-${ZIG_VERSION}-aarch64-macos.tar.gz"
          if [ -x zig-mayflower-prefix/bin/zig ]; then
            ZIG_BOOT="$PWD/zig-mayflower-prefix/bin/zig"
          else
            ZIG_BOOT="$(find zig-mayflower-prefix -type f -name zig | head -1)"
          fi
          test -x "$ZIG_BOOT"
          echo "ZIG_BOOT=$ZIG_BOOT" >> "$GITHUB_ENV"
          # Homebrew LLVM dylibs must exist before running macos-host zig
          # (linked against /opt/homebrew/opt/llvm@21/...). Same runner as build.
          brew install llvm@21 lld@21 zstd ldid
          brew --prefix llvm@21
          "$ZIG_BOOT" version
          otool -L "$ZIG_BOOT" | head -20

      - name: Fetch Zig ${{ env.ZIG_VERSION }} sources + Mayflower patch
        run: |
          set -euo pipefail
          curl -fsSL -o "zig-${ZIG_VERSION}.tar.xz" \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-${ZIG_VERSION}.tar.xz"
          tar xf "zig-${ZIG_VERSION}.tar.xz"
          cd "zig-${ZIG_VERSION}"
          patch -p1 < "$GITHUB_WORKSPACE/packages/zig/patches/src_link_MachO.zig.patch"
          grep -n flushMayflowerIosDevice src/link/MachO.zig | head
          echo "ZIG_SRC=${GITHUB_WORKSPACE}/zig-${ZIG_VERSION}" >> "$GITHUB_ENV"

      - name: Cross-build ios-host zig (enable-llvm=false)
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          test -n "$SDK" && test -d "$SDK"
          PREFIX="${GITHUB_WORKSPACE}/zig-mayflower-ios-prefix"
          WORK="${GITHUB_WORKSPACE}/ios-host-ent"
          mkdir -p "$WORK" "$PREFIX"
          cat > "$WORK/entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>platform-application</key>
            <true/>
            <key>com.apple.private.security.container-required</key>
            <false/>
          </dict>
          </plist>
          PLIST
          export ZIG_LDID_ENTITLEMENTS="$WORK/entitlements.plist"
          cd "$ZIG_SRC"
          # Flat-ish install: we re-layout for make.sh after.
          "$ZIG_BOOT" build \
            -Dtarget=aarch64-ios \
            -Dcpu=apple_a11 \
            -Denable-llvm=false \
            -Doptimize=ReleaseFast \
            -Dno-langref=true \
            -Dstrip=true \
            --sysroot "$SDK" \
            --prefix "$PREFIX" \
            --verbose-link \
            2>&1 | tee "${GITHUB_WORKSPACE}/ios-host-build.log"
          # Locate zig binary
          ZIG_IOS="$(find "$PREFIX" -type f -name zig | head -1)"
          test -n "$ZIG_IOS" && test -x "$ZIG_IOS"
          echo "ZIG_IOS=$ZIG_IOS" >> "$GITHUB_ENV"
          file "$ZIG_IOS"
          lipo -info "$ZIG_IOS" || true
          # Ensure Mach-O is iphoneos, not macos
          if otool -l "$ZIG_IOS" | grep -q 'LC_BUILD_VERSION' ; then
            otool -l "$ZIG_IOS" | grep -A6 LC_BUILD_VERSION | head -20
          fi
          if command -v ldid >/dev/null; then
            ldid -S"$ZIG_LDID_ENTITLEMENTS" "$ZIG_IOS" || ldid -S "$ZIG_IOS"
            ldid -e "$ZIG_IOS" || true
          fi
          # Layout for packages/zig make.sh: PREFIX/zig + PREFIX/lib
          DIST="${GITHUB_WORKSPACE}/zig-mayflower-ios-dist"
          rm -rf "$DIST"
          mkdir -p "$DIST"
          cp "$ZIG_IOS" "$DIST/zig"
          # lib/ next to zig (official / make.sh layout)
          if [ -d "$PREFIX/lib" ]; then
            cp -R "$PREFIX/lib" "$DIST/"
          elif [ -d "$PREFIX/lib/zig" ]; then
            mkdir -p "$DIST/lib"
            cp -R "$PREFIX/lib/zig" "$DIST/lib/"
          else
            # zig build may install under lib/zig-0.16.0 style — gather
            LIBDIR="$(find "$PREFIX" -type d -name lib | head -1)"
            test -n "$LIBDIR"
            cp -R "$LIBDIR" "$DIST/"
          fi
          chmod 755 "$DIST/zig"
          ls -lh "$DIST/zig"
          du -sh "$DIST" "$DIST/lib" || true
          echo "DIST=$DIST" >> "$GITHUB_ENV"

      - name: Pack ios-host artifact
        run: |
          set -euo pipefail
          test -x "${DIST}/zig"
          test -d "${DIST}/lib"
          cat > "${DIST}/MAYFLOWER-README.txt" <<'TXT'
          Mayflower patched Zig (ios aarch64 host, no embedded LLVM)
          - For packages/zig ZIG_DIST_DIR → make.sh → iphoneos-arm64 deb
          - Device Exe/dylib link: system clang + ldid (MachO patch)
          - Built on GHA by cross from macos-host with -Denable-llvm=false
          TXT
          tar -C "$(dirname "$DIST")" -czf \
            "zig-mayflower-${ZIG_VERSION}-aarch64-ios.tar.gz" "$(basename "$DIST")"
          ls -lh "zig-mayflower-${ZIG_VERSION}-aarch64-ios.tar.gz"
          # also keep build log
          test -f ios-host-build.log

      - name: Upload ios-host artifact
        uses: actions/upload-artifact@v4
        with:
          name: zig-mayflower-${{ env.ZIG_VERSION }}-aarch64-ios
          path: |
            zig-mayflower-${{ env.ZIG_VERSION }}-aarch64-ios.tar.gz
            ios-host-build.log
          if-no-files-found: error
          retention-days: 30
